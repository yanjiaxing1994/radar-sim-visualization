# radar_sim nginx 站点配置
#
# 本文件必须被 nginx.conf 的 http { } 块包含，例如：
#   麒麟 V10:   /etc/nginx/conf.d/radar_sim.conf
#   macOS:      /opt/homebrew/etc/nginx/servers/radar_sim.conf
#
# 架构：
#   浏览器 -> nginx :8088 -> /            直接读取 frontend/index.html
#                          -> /api/       反向代理到后端 127.0.0.1:8080
#                          -> /health    反向代理到后端 127.0.0.1:8080
#                          -> /ws        反向代理到后端 127.0.0.1:8081

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream radar_sim_http {
    server 127.0.0.1:8080;
}

upstream radar_sim_ws {
    server 127.0.0.1:8081;
}

server {
    # 本地调试使用 8088；生产环境可改成 80。
    listen 8088;
    server_name _;

    charset utf-8;
    tcp_nodelay on;

    # 前端静态目录。
    # macOS 本地调试示例：
    #   root /Users/<user>/code/radar_sim/frontend;
    # 如果部署在 /opt/radar_sim-dist，则改为 /opt/radar_sim-dist/frontend。
    root /opt/radar_sim/frontend;
    index index.html;

    # 后端请求体上限为 1 MiB，这里保持一致。
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 入口 HTML 不缓存，保证前端更新后刷新即可生效。
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存；当前 Leaflet 仍从 CDN 加载，本地化后可复用此规则。
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }

    # HTTP API：/api/simulate、/api/config
    location /api/ {
        proxy_pass http://radar_sim_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://radar_sim_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket：前端连接同源 /ws，nginx 转发到后端 8081。
    location /ws {
        proxy_pass http://radar_sim_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
